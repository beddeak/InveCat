# 인벤토리 한 칸이 사라지는 주기(초, 5~86400). 게임 안에서 /invecat interval 10 (=10분) 처럼 바꿀 수 있습니다.
lock-interval-seconds: 600

# 칸이 사라지기 직전 화면 가운데 뜨는 카운트다운(초). 0이면 끕니다.
countdown-seconds: 5

# 사라질 칸 고르는 방법. 핫바 1번은 절대 사라지지 않고, 나머지 40칸(인벤토리 35칸, 갑옷 4칸, 왼손)이 사라집니다.
# random = 40칸 중 무작위, hotbar-last = 위쪽 27칸·갑옷·왼손을 먼저 무작위로 다 없애고 핫바 2~9번은 마지막
lock-order: random

# 사라지는 칸에 들어 있던 아이템(갑옷 칸이면 입고 있던 갑옷).
# move = 빈 칸으로 옮기고 빈 칸이 없으면 바닥에 떨어뜨림, drop = 바닥에 떨어뜨림, delete = 같이 사라짐
locked-item: move

# 다음에 사라질 칸을 보스바와 카운트다운에 미리 알려 줍니다.
show-next-slot: true

# 화면 위 보스바로 남은 시간·남은 칸을 보여 줍니다.
bossbar: true

# 이 게임 모드인 플레이어끼리 인벤토리를 공유합니다. 관전자·크리에이티브(촬영자, 관리자)는 기본으로 빠집니다.
game-modes:
  - SURVIVAL
  - ADVENTURE
